; Firmware do pêndulo de Furuta (ESP32-S3 + DRV8825 + encoder magnético I2C)
; Toda a comunicação é BTP pela USB nativa do S3 (TinyUSB CDC), com o TraceView: comandos no terminal,
; telemetria em tópicos (src/btp_app.cpp). Biblioteca: c:/git/BTPDevice (+ BTP e TinyShell ao lado).
;
; Gravar: pio run -t upload --upload-port COMx. Se a porta não aparecer (o TinyUSB ocupa a USB), segure BOOT,
; aperte RESET e solte BOOT: o S3 entra no modo de gravação pela mesma USB.
; Otimização do controlador: MPC_OPT=-O2 no ambiente (padrão -O3), com pio run -t clean antes de trocar.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform      = espressif32 @ 7.0.1
board         = esp32-s3-devkitc-1
framework     = espidf
upload_speed  = 921600
