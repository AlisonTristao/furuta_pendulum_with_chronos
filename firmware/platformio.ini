; Firmware do pêndulo de Furuta (ESP32-S3 N16R8 + DRV8825 + encoder magnético I2C)
; Toda a comunicação é BTP pela USB nativa do S3 (TinyUSB CDC), com o TraceView: comandos no terminal,
; telemetria em tópicos (src/main.cpp). Biblioteca: c:/git/BTPDevice (+ BTP e TinyShell ao lado).
;
; Gravar: feche o TraceView (ele segura a porta) e rode  pio run -t upload
;   grava_s3.py abre a porta "furuta" a 1200 baud, o firmware reinicia no modo de gravação (src/gravacao.cpp), o
;   esptool grava pelo USB-Serial-JTAG e sai com watchdog_reset (o reset pela USB deixaria o chip no modo de
;   gravação). Se o firmware estiver travado: segure BOOT, aperte RESET, solte BOOT e grave do mesmo jeito.
; Otimização do controlador: MPC_OPT=-O2 no ambiente (padrão -O3), com pio run -t clean antes de trocar.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform      = espressif32 @ 7.0.1
board         = esp32-s3-devkitc-1
framework     = espidf
upload_speed  = 921600
board_upload.after_reset = watchdog_reset
extra_scripts = pre:grava_s3.py

; Diagnóstico do boot: console e logs no USB-Serial-JTAG (sdkconfig.debug). pio run -e esp32s3_debug -t upload
[env:esp32s3_debug]
extends       = env:esp32s3
monitor_speed = 115200
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.debug"
build_flags   = -DFURUTA_DEBUG_BOOT
