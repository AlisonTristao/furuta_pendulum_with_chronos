; Firmware do pêndulo de Furuta (ESP32 + DRV8825 + encoder magnético I2C)
; Protocolo serial: ver ../README.md

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32 @ 7.0.1
board         = esp32dev
framework     = espidf
monitor_speed = 921600
upload_speed  = 921600

; Teste de bancada dos pinos: pio run -e teste_pinos -t upload -t monitor
[env:teste_pinos]
extends     = env:esp32dev
build_flags = -DTESTE_PINOS

; Benchmark do MPC (tempo de cada passo no núcleo 1): pio run -e bench -t upload -t monitor
; Otimização do controlador: MPC_OPT=-O3 (padrão -O2), com pio run -e bench -t clean antes de trocar
[env:bench]
extends     = env:esp32dev
build_flags = -DBENCH
