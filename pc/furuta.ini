[trim]
; Corrige o zero do θ2 no equilíbrio, em tempo real (controlador.h): trim += (Ts/tau)·θ2 enquanto equilibra.
; Sim com sim.offset_th2 = ±0,03: trim chega a ±0,028-0,031 em 30 s; θ1 média -0,78 rad sem trim, -0,07 com.
; tau 4: rms θ2 1,29°, tau 15: 1,17° (sem erro e sem trim: 1,13°)
