tau    = 10     ; constante de tempo [s]: bem mais lenta que o equilíbrio
max    = 0.06   ; |trim| máximo [rad] (3,4°): bater aqui é sinal de outro problema
janela = 0.15   ; só aprende com |θ2| abaixo disso [rad], há 1 s, |dθ2| < 2 e u sem saturar
valor  = 0.024  ; offset do topo [rad]: o topo verdadeiro fica +1,4° fora do zero medido embaixo (14/11: o trim
                ; aprendeu +0,0254 e +0,0224 com a mesa corrigida). Sim com sim.offset_th2 = 0,024: sem ele θ1 fica em
                ; -0,72 rad; com ele +0,01..+0,03. Com liga = 1 o firmware guarda aqui o aprendido em cada ensaio

[inclinacao]
; Mesa torta: o topo verdadeiro fica em θ2 = seno·sin θ1 + cosseno·(cos θ1 − 1) (controlador_inclinacao). Medido
; pelo firmware (furuta -inclina, e no -auto entre o homing e o start): o braço para em `pontos` posições do curso,
; o braço excita o pêndulo em ressonância (θ̈1 = A cos(ωn t), A tirado da seção [fisico] para dar `amplitude`) e o
; centro da oscilação em cada uma dá a vertical verdadeira (inclina.c).
pontos  = 1      ; 1: o -auto só acerta o zero pela oscilação em θ1 = 0 (~8 s) e usa seno/cosseno. A mesa inteira é
                 ; só no furuta -inclina (7 posições, ~1 min), quando mexer na mesa: o minuto de motor ligado esquenta
                 ; o motor e a subida logo depois sai ruim (14/11: frio sobe clean, depois da varredura não). 0: o
                 ; -auto não calibra
grava   = 5      ; oscilação gravada em cada posição [s] (2-8: parada em READY por 10 s a malha desliga o driver)
amplitude = 1.0  ; amplitude NOMINAL da excitação [rad]: a que daria sem atrito. Com o atrito seco (sim.tc2 2e-4) o
                 ; pêndulo sai com ~metade: 1,0 -> ~0,5 rad e 6 trincas, centro com erro < 0,5 mrad (sim). 0,6 -> 2
                 ; trincas (descarta). 14/11: tranco de 20 rad/s² dava < 0,13 rad e descartou todos os pontos
ciclos  = 3      ; ciclos da excitação: 1,0 rad em 3 ciclos = A 13 rad/s², braço ±0,32 rad
seno    = 0.0144 ; coeficientes [rad] (furuta -inclina 14/11: 0,0154/-0,0004 e 0,0134/+0,0037, mesa ~0,8°). O
cosseno = 0.0017 ; -inclina grava o medido na flash (NVS) e ele vale por cima destes, até no boot e no cfg -reset

