; Pêndulo de Furuta real (ESP32 + motor de passo). Controle = artigo ICIT 27.
;
; Com o motor de passo impondo θ̈1, só os parâmetros da equação do pêndulo precisam ser físicos: L1, m2, l2, I2, mu2
; (m2 entra junto com mu2). I1 e mu1 definem o braço "virtual" que converte o torque do MPC em aceleração
; (θ̈1 ≈ u / (I1 + m2 L1²)): ficam os do artigo.

[fisico]
L1  = 0.09145        ; eixo do motor até o eixo do pêndulo (encoder) [m]
I1  = 0.005          ; braço virtual (artigo)
mu1 = 0.001          ; braço virtual (artigo)
g   = 9.81
; Pêndulo: l2 medido (equilíbrio numa borda, 9 cm); I2 e mu2 do ident.exe (ensaios/ident1.csv, 10/11/2026):
; período 0,68 s, consistente com l2. m2 = haste ~9,3 g + moeda 4,8 g; só escala I2 e mu2.
; O atrito do pêndulo é SECO (perde ~0,09 rad por meio-ciclo, para fora do zero; Tc ≈ 5e-4 N·m). O modelo só tem
; atrito viscoso: mu2 abaixo é o equivalente ajustado em 4 meios-ciclos (zeta ≈ 0,13), aproximação grosseira.
; Com esse atrito o swing-up do artigo não sobe dentro do curso do braço (simulado): começar pelo modo equilíbrio.
m2  = 0.01410
l2  = 0.09008
I2  = 4.3796e-05
mu2 = 3.6494e-04

[mpc]
Np            = 40
Q             = 10, 100, 5, 1
Rdu           = 100
u_min         = -0.6
u_max         = 0.6
dtheta_max    = 25   ; = V_MAX do firmware [rad/s]
rho_avg       = 1
terminal_dlqr = 1
l_max         = 5
eps_rho       = 1e-3
; theta1_min/max: vêm do homing (limite de software do firmware menos margem_theta1)
theta1_min    = -1.46
theta1_max    = 1.46
qv_theta1     = 1e5  ; artigo: 1e3. Com o curso de ±1,56 rad a folga precisa ser quase dura (1e3 deixa |θ1| = 2,8)

[ensaio]
porta             = COM7
Ts                = 0.02
duracao           = 15
modo              = equilibrio   ; equilibrio | swingup
janela_equilibrio = 0.15         ; |θ2| em que o modo equilíbrio assume [rad]
theta1_ref        = 0
usa_limite_homing = 1
margem_theta1     = 0.1
dtheta2_aborta    = 40

[sim]
x0      = 0, 3.14159265358979, 0, 0
rk4_sub = 10
tc2     = 5e-4     ; atrito seco do pêndulo só na planta simulada (o MPC não modela)
