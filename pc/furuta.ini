; Pêndulo de Furuta real (ESP32 + motor de passo). Controle = artigo ICIT 27.
;
; Com o motor de passo impondo θ̈1, só os parâmetros da equação do pêndulo precisam ser físicos: L1, m2, l2, I2, mu2
; (m2 entra junto com mu2). I1 e mu1 definem o braço "virtual" que converte o torque do MPC em aceleração
; (θ̈1 ≈ u / (I1 + m2 L1²)): ficam os do artigo.

[fisico]
L1  = 0.09145        ; eixo do motor até o eixo do pêndulo (encoder) [m]
I1  = 0.005          ; braço virtual (artigo)
mu1 = 0.001          ; braço virtual (artigo)
g   = 9.81
; Pêndulo: l2 medido (equilíbrio numa borda, 9 cm); I2 e mu2 do ident.exe (ensaios/ident1.csv, 10/11/2026):
; período 0,68 s, consistente com l2. m2 = haste ~9,3 g + moeda 4,8 g; só escala I2 e mu2.
; O atrito do pêndulo é SECO (perde ~0,09 rad por meio-ciclo, para fora do zero; Tc ≈ 5e-4 N·m). O modelo só tem
; atrito viscoso: mu2 abaixo é o equivalente ajustado em 4 meios-ciclos (zeta ≈ 0,13), aproximação grosseira.
; Com esse atrito o swing-up do artigo não sobe dentro do curso do braço (simulado): começar pelo modo equilíbrio.
m2  = 0.01410
l2  = 0.09008
I2  = 4.3796e-05
mu2 = 3.6494e-04

[mpc]
Np            = 40
Q             = 10, 100, 5, 1   ; Q1 = 30 + θ1 ±1,16 foi pior no real (23:24-23:28): topo 25-60% do tempo vs 62-68%
Rdu           = 300   ; ensaio 23:04: equilibrou 30 s com rms θ2 0,049 rad (Rdu 100: 0,054)
; u é o torque do braço VIRTUAL (I1 = 0,005): θ̈1 ≈ 199·u rad/s², ±0,6 = ±120 rad/s². Com ±1,25 (250 rad/s²) o
; motor perdeu passos (FIM_DE_CURSO com θ1 contado em ±1,44, chaves em ±1,71) e o equilíbrio ficou agressivo.
; Swing-up (23:11-23:12): ±0,9 sobe em 2 s mas não segura (o braço chega a ±1,57 e cai 7 vezes); ±0,75 sobe em
; 3 s e equilibrou 18 s (rms θ2 0,055), sem falha. ±0,6 equilibra igual (0,049) mas sobe devagar (~9 s).
u_min         = -0.75
u_max         = 0.75
; controle separado para o equilíbrio (troca em |θ2| < ensaio.troca_equilibrio, volta em 2×). Desligado: na
; simulação a troca piorou a captura (recria o MPC sem a solução anterior). Ex.: u_max_equilibrio = 0.6
; Rdu_equilibrio = 100, troca_equilibrio = 0.1
dtheta_max    = 25   ; = V_MAX do firmware [rad/s]
rho_avg       = 1
terminal_dlqr = 1
l_max         = 5
eps_rho       = 1e-3
; theta1_min/max: vêm do homing (limite de software do firmware menos margem_theta1)
theta1_min    = -1.46
theta1_max    = 1.46
qv_theta1     = 1e5  ; artigo: 1e3. Com o curso de ±1,56 rad a folga precisa ser quase dura (1e3 deixa |θ1| = 2,8)
peso_exp      = 0    ; peso do estágio k = exp(α((k+1)/N-1)). Sim (20 sementes): α=3 captura em 2,6 s (0,9-7,6)
                     ; contra 3,2 s (0,9-21,8) com 0; equilíbrio um pouco mais solto (1,9° vs 1,4°). Testar no real

[ensaio]
porta             = COM7
Ts                = 0.02
duracao           = 15
modo              = equilibrio   ; equilibrio | swingup
janela_equilibrio = 0.15         ; |θ2| em que o modo equilíbrio assume [rad]
comp_atraso_ms    = 20           ; prediz o estado 20 ms à frente antes do MPC (sem: bang-bang; 30 compensa demais)
wrap_theta2       = 0              ; 1: θ2 dobrado em ±π antes do MPC. Sim: sobe pelo lado mais perto e reequilibra
                                 ; melhor após quedas, mas às vezes empaca balançando embaixo; captura 3,6 s (não ajudou)
wrap_hist         = 0              ; histerese do dobramento [rad]; 0,5 empacou 17/20, >= 1 = igual a sem dobrar
estimador         = 1            ; 1: dθ2 estimado no PC com o modelo e o θ̈1 comandado (erro ~0,3 rad/s nos dados
                                 ; reais contra ~0,95 do observador). 23:34-23:37: RMS θ2 0,6-1,5° (antes 4-6°)
est_L1            = 0.5
est_L2            = 20
theta1_ref        = 0
usa_limite_homing = 1
margem_theta1     = 0.1    ; 0,4 (θ1 ±1,16) piorou no real: o braço briga com o limite e o pêndulo cai mais
dtheta2_aborta    = 40

[sim]
; Planta simulada calibrada com os ensaios reais de 10/11/2026 (ver sim_estat.py). Reproduz: sem compensação de
; atraso = bang-bang com quedas o tempo todo (1º ensaio real); estimador + comp. 20 ms = sobe e equilibra (~95% no
; topo, ~1,5°). NÃO reproduz: sem estimador o real ficou agressivo (4-6°, a ~85) e a simulação fica calma.
; A simulação é biestável (calma ou ciclo agressivo): compare configurações com várias sementes (sim_estat.py).
x0      = 0, 3.14159265358979, 0, 0
rk4_sub = 10
mu2_planta = 1.2e-4 ; atrito viscoso real do pêndulo: ajuste nos ensaios dá μ2/δ 0,5-1,1 (modelo: 2,3)
tc2     = 2e-4     ; atrito seco do pêndulo só na planta simulada (o MPC não modela)
planta_acel = 1    ; planta comandada em θ̈1, como o hardware
obs_hz      = 40   ; dθ2 pelo observador do firmware
bits_enc    = 12   ; AS5600
ruido_enc   = 0    ; ruído de θ2 em LSB: parado, o real tem < 0,2 LSB de rugosidade
atraso_ms   = 3.5  ; medido nos ensaios: Δdθ1 do firmware = 0,18·a[k-1] + 0,82·a[k] (t_ciclo ≈ 4 ms). O antigo
                   ; 20 ms vinha de uma planta sem motor/observador e não bate com os dados
passos_rev  = 3200 ; 200 passos x micropasso 16: θ1 medido em passos inteiros (0,002 rad)
a_max       = 300  ; A_MAX do firmware (satura o comando e freia antes do limite)
v_max       = 25   ; V_MAX do firmware; dθ1 medido = velocidade comandada, como no firmware
limite_sw   = 1.56 ; limite de software após o homing (meio curso 1,71 - margem 0,15)
f_motor     = 0    ; ressonância rotor+braço [Hz] (0 = rígido). 20-100 Hz não mudou o resultado
zeta_motor  = 0.1
ripple_passo = 0   ; erro do micropasso (fração do passo inteiro, precisa f_motor > 0); 0,1-0,2 não mudou o resultado
semente     = 0    ; > 0: perturba θ2 inicial e o ruído (sim_estat.py varia)
