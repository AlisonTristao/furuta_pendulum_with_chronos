; as 10 iterações): N40 l5 captura 3,2 s, 95% no topo, 2,4° | N20 l5 2,5 s, 95%, 1,9° | N20 l2 2,8 s, 95%, 1,7° |
; N15 l2 2,2 s, 95%, 1,7°. Ruins: N40 l2 (8% no topo), N20 l1 (5%), N20 l2 max_iter 7 (64%). Np 20 não testado no real
