; Pêndulo de Furuta real (ESP32-S3 + motor de passo). Controle = artigo ICIT 27.
; Este arquivo é embutido no firmware na compilação: é a configuração padrão do ESP32 (mudou aqui, recompile e
; grave). No TraceView, cfg -set secao.chave=valor muda até o próximo boot. O sim.exe também lê este arquivo.
;
; Com o motor de passo impondo θ̈1, só os parâmetros da equação do pêndulo precisam ser físicos: L1, m2, l2, I2, mu2
; (m2 entra junto com mu2). I1 e mu1 definem o braço "virtual" que converte o torque do MPC em aceleração
; (θ̈1 ≈ u / (I1 + m2 L1²)): ficam os do artigo.

[fisico]
L1  = 0.0791         ; EFETIVO (regressão): o medido é 9,145 cm, o braço transmite ~85% da aceleração comandada [m]
I1  = 0.005          ; braço virtual (artigo)
mu1 = 0.001          ; braço virtual (artigo)
g   = 9.81
; Pêndulo: l2 medido (equilíbrio numa borda, 9 cm); I2 e mu2 do ident.exe (ensaios/ident1.csv, 10/11/2026):
; período 0,68 s, consistente com l2. m2 = haste ~9,3 g + moeda 4,8 g; só escala I2 e mu2.
; O atrito do pêndulo é SECO (perde ~0,09 rad por meio-ciclo, para fora do zero; Tc ≈ 5e-4 N·m). O modelo só tem
; atrito viscoso: mu2 abaixo é o equivalente ajustado em 4 meios-ciclos (zeta ≈ 0,13), aproximação grosseira.
; Com esse atrito o swing-up do artigo não sobe dentro do curso do braço (simulado): começar pelo modo equilíbrio.
; 12/11/2026: suporte novo (mais pesado, centro de massa em 8,5 cm). ident.exe: período 0,666 s, zeta 0,060
; (atrito seco domina). Com o motor impondo θ̈1 só l2, J/m2 e μ2/m2 importam: m2 mantido, I2 e mu2 nessa escala.
; Antes: l2 0,09008, I2 4,3796e-05, mu2 3,6494e-04 (período 0,708 s)
; Valores abaixo: regressão nos ensaios de swing-up (regressao.py, 12/11). Medidos (ident.exe, l2 8,5 cm):
; L1 0,09145, l2 0,085, I2 2,9980e-05, mu2 1,4866e-04 (refazer: furuta -ident 0.085 no terminal do TraceView)
m2  = 0.01410
l2  = 0.1078
I2  = 1.9036e-05
mu2 = 1.4094e-04

